# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/logistics_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Failure Monitor
# Scan every 15 seconds
app.monitor.scan-interval-ms=15000
# Flag shipment as delayed after 3 minutes of IN_TRANSIT
app.monitor.delay-threshold-minutes=3

# Logging
logging.level.com.logistics=INFO
logging.level.org.springframework.web=WARN
